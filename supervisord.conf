[supervisord]
nodaemon=true
user=root
environment=PYTHONPATH="/app",PYTHONUNBUFFERED="1",DOCKER_ENV="true"

[program:fastapi]
command=python main.py
directory=/app
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
environment=PYTHONPATH="/app",PYTHONUNBUFFERED="1",DOCKER_ENV="true"

[program:gradio]
command=python gradio_app.py
directory=/app
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
environment=PYTHONPATH="/app",PYTHONUNBUFFERED="1",DOCKER_ENV="true",API_BASE_URL="http://localhost:8000"

[unix_http_server]
file=/tmp/supervisor.sock

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface